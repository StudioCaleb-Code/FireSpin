<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Ruleta Premium - Magic Spin Deluxe</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-gradient-start: #f1f5f9;
      --bg-gradient-end: #eef2ff;
      --card-bg: rgba(255, 255, 255, 0.85);
      --sidebar-blur: 20px;
      --primary: #4f46e5;
      --primary-dark: #4338ca;
      --accent: #ec4899;
      --text-main: #0f172a;
      --text-soft: #475569;
      --shadow-xl: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      --shadow-md: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.02);
      --radius-2xl: 32px;
      --radius-xl: 24px;
      --radius-lg: 20px;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at 10% 20%, rgba(79, 70, 229, 0.08), transparent 40%),
                  radial-gradient(circle at 90% 70%, rgba(236, 72, 153, 0.08), transparent 40%),
                  linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-end));
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* layout premium */
    .app {
      display: flex;
      flex-wrap: wrap;
      min-height: 100vh;
    }

    /* SIDEBAR ELEGANTE */
    .sidebar {
      width: 340px;
      background: var(--card-bg);
      backdrop-filter: blur(var(--sidebar-blur));
      border-right: 1px solid rgba(255, 255, 255, 0.6);
      padding: 32px 24px;
      display: flex;
      flex-direction: column;
      box-shadow: 8px 0 25px -15px rgba(0, 0, 0, 0.05);
      z-index: 10;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 28px;
    }

    .icon-gem {
      width: 56px;
      height: 56px;
      background: linear-gradient(145deg, var(--primary), #7c3aed);
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      box-shadow: 0 18px 30px -10px rgba(79, 70, 229, 0.4);
    }

    .logo-area h1 {
      font-size: 28px;
      font-weight: 800;
      background: linear-gradient(120deg, #1e1b4b, #4f46e5);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: -0.5px;
    }

    .desc {
      color: var(--text-soft);
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 32px;
      font-weight: 500;
      border-left: 3px solid var(--primary);
      padding-left: 16px;
    }

    /* lista jugadores mejorada */
    .players-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 28px;
      max-height: 420px;
      overflow-y: auto;
      padding-right: 5px;
    }

    .players-container::-webkit-scrollbar {
      width: 4px;
    }

    .players-container::-webkit-scrollbar-track {
      background: #e2e8f0;
      border-radius: 10px;
    }

    .players-container::-webkit-scrollbar-thumb {
      background: var(--primary);
      border-radius: 10px;
    }

    .player-card {
      background: white;
      border-radius: var(--radius-lg);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 16px;
      transition: all 0.25s ease;
      border: 1px solid rgba(203, 213, 225, 0.5);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
    }

    .player-card:hover {
      transform: translateX(6px);
      border-color: var(--primary);
      box-shadow: var(--shadow-md);
    }

    .player-num {
      width: 44px;
      height: 44px;
      background: linear-gradient(125deg, #eef2ff, #e0e7ff);
      color: var(--primary-dark);
      font-weight: 800;
      font-size: 1.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 18px;
    }

    .player-name {
      font-weight: 700;
      font-size: 1.05rem;
      color: var(--text-main);
    }

    /* botón girar ultra premium */
    .btn-spin {
      background: linear-gradient(105deg, var(--primary), var(--primary-dark));
      border: none;
      border-radius: 60px;
      padding: 18px 12px;
      font-weight: 800;
      font-size: 1.2rem;
      color: white;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
      box-shadow: 0 18px 30px -12px rgba(79, 70, 229, 0.5);
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-top: 12px;
    }

    .btn-spin:hover:not(:disabled) {
      transform: scale(1.02) translateY(-3px);
      box-shadow: 0 25px 35px -12px rgba(79, 70, 229, 0.7);
    }

    .btn-spin:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      transform: scale(0.98);
    }

    .winner-card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(8px);
      border-radius: var(--radius-xl);
      padding: 20px 16px;
      margin-top: 24px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.8);
      box-shadow: var(--shadow-md);
    }

    .winner-label {
      font-weight: 600;
      color: var(--text-soft);
      letter-spacing: 0.5px;
      font-size: 0.85rem;
      text-transform: uppercase;
    }

    .winner-name {
      font-size: 1.6rem;
      font-weight: 800;
      background: linear-gradient(135deg, #4f46e5, #db2777);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-top: 6px;
    }

    /* área de la ruleta */
    .wheel-area {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      padding: 30px;
    }

    .wheel-wrapper {
      position: relative;
      width: min(70vw, 70vh, 620px);
      height: min(70vw, 70vh, 620px);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .glow-ring {
      position: absolute;
      width: 105%;
      height: 105%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(79,70,229,0.2), transparent 70%);
      animation: softPulse 3s infinite;
      pointer-events: none;
    }

    @keyframes softPulse {
      0% { transform: scale(0.96); opacity: 0.5; }
      100% { transform: scale(1.08); opacity: 0.9; }
    }

    .pointer-static {
      position: absolute;
      top: -28px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 32px solid transparent;
      border-right: 32px solid transparent;
      border-top: 70px solid #1e293b;
      z-index: 25;
      filter: drop-shadow(0 8px 12px rgba(0,0,0,0.2));
    }

    .pointer-static::after {
      content: "✨";
      position: absolute;
      top: -78px;
      left: -20px;
      font-size: 28px;
      color: #fbbf24;
      text-shadow: 0 0 6px gold;
    }

    .wheel {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      overflow: hidden;
      border: 12px solid white;
      box-shadow: var(--shadow-xl), inset 0 0 40px rgba(255,255,240,0.6);
      transition: transform 6.5s cubic-bezier(0.23, 0.98, 0.32, 1.02);
      background: #fefce8;
    }

    .segment {
      position: absolute;
      width: 50%;
      height: 50%;
      transform-origin: 100% 100%;
      clip-path: polygon(0% 0%, 100% 0%, 100% 100%);
      display: flex;
      align-items: flex-start;
      justify-content: center;
      backface-visibility: hidden;
    }

    .segment span {
      position: absolute;
      top: 18%;
      font-weight: 800;
      font-size: clamp(12px, 3vw, 20px);
      color: white;
      text-shadow: 0 2px 6px rgba(0,0,0,0.4);
      white-space: nowrap;
      transform-origin: center;
      letter-spacing: 0.5px;
    }

    .center-badge {
      position: absolute;
      width: 32%;
      height: 32%;
      background: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
      box-shadow: 0 20px 35px -8px black(0,0,0,0.3);
      border: 4px solid rgba(255,215,0,0.5);
      backdrop-filter: blur(4px);
    }

    .center-badge span {
      font-weight: 900;
      font-size: 1.1rem;
      background: linear-gradient(145deg, #4f46e5, #be185d);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-align: center;
    }

    /* partículas flotantes */
    .particles-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .particle {
      position: absolute;
      background: radial-gradient(circle, #a5b4fc, #c084fc);
      border-radius: 50%;
      opacity: 0.35;
      animation: drift 18s infinite alternate;
    }

    @keyframes drift {
      0% { transform: translateY(0px) translateX(0px) scale(1); }
      100% { transform: translateY(-80px) translateX(40px) scale(1.1); }
    }

    /* responsive */
    @media (max-width: 860px) {
      .sidebar {
        width: 100%;
        flex-direction: row;
        flex-wrap: wrap;
        gap: 16px;
        padding: 20px;
        backdrop-filter: blur(24px);
      }
      .logo-area { margin-bottom: 0; width: auto; }
      .desc { margin-bottom: 0; width: 100%; }
      .players-container { flex-direction: row; flex-wrap: wrap; max-height: none; gap: 10px; order: 2; width: 100%; margin-top: 15px; }
      .player-card { width: calc(50% - 10px); }
      .btn-spin { order: 3; margin-top: 10px; width: 100%; }
      .winner-card { order: 4; margin-top: 12px; width: 100%; }
      .wheel-area { min-height: 480px; }
    }

    @media (max-width: 550px) {
      .player-card { width: 100%; }
      .pointer-static { top: -20px; border-left: 22px solid transparent; border-right: 22px solid transparent; border-top: 52px solid #1e293b; }
      .pointer-static::after { top: -58px; left: -18px; font-size: 22px; }
    }

    .glow-text {
      animation: glowPulse 1s ease;
    }

    @keyframes glowPulse {
      0% { text-shadow: 0 0 0px gold; }
      100% { text-shadow: 0 0 12px #ffd966; }
    }
  </style>
</head>
<body>

<div class="particles-bg" id="particlesContainer"></div>

<div class="app">
  <!-- sidebar mejorado con organización perfecta -->
  <div class="sidebar">
    <div class="logo-area">
      <div class="icon-gem">🎰</div>
      <h1>MAGIC SPIN</h1>
    </div>
    <div class="desc">
      ⚡ Ruleta de lujo · Gira y siente la adrenalina, el destino elegirá al afortunado.
    </div>

    <div class="players-container" id="playersListPremium"></div>

    <button class="btn-spin" id="spinPremiumBtn">
      🎡 GIRAR RULETA 🎡
    </button>

    <div class="winner-card" id="winnerPremiumBox">
      <div class="winner-label">✨ GANADOR ACTUAL ✨</div>
      <div class="winner-name" id="winnerPremiumName">Espera tu turno</div>
    </div>
  </div>

  <!-- área principal ruleta -->
  <div class="wheel-area">
    <div class="wheel-wrapper">
      <div class="glow-ring"></div>
      <div class="pointer-static"></div>
      <div class="wheel" id="premiumWheel"></div>
      <div class="center-badge">
        <span>★<br>SPIN</span>
      </div>
    </div>
  </div>
</div>

<script>
  // ============================ CONFIGURACIÓN PREMIUM ==========================
  const PLAYERS_LIST = [
    "Carlos Magno", "Andrea Rubí", "Luis Estrella", "Fernanda Jade",
    "Miguel Élite", "Sofía Diamante", "Javier Platino", "Valeria Zafiro"
  ];

  const COLOR_PALETTE = [
    "#a855f7", "#6366f1", "#06b6d4", "#10b981",
    "#f43f5e", "#f97316", "#eab308", "#8b5cf6"
  ];

  // elementos del DOM
  const wheelContainer = document.getElementById("premiumWheel");
  const playersContainer = document.getElementById("playersListPremium");
  const winnerNameSpan = document.getElementById("winnerPremiumName");
  const spinButton = document.getElementById("spinPremiumBtn");

  let currentRotationDeg = 0;
  let isSpinning = false;

  const segmentCount = PLAYERS_LIST.length;
  const segmentAngle = 360 / segmentCount;

  // ========== 1. CONSTRUIR LISTA DE JUGADORES DINÁMICA Y ORGANIZADA ==========
  function buildPlayersList() {
    playersContainer.innerHTML = "";
    PLAYERS_LIST.forEach((player, idx) => {
      const playerDiv = document.createElement("div");
      playerDiv.className = "player-card";
      playerDiv.setAttribute("data-index", idx);
      playerDiv.innerHTML = `
        <div class="player-num">${idx + 1}</div>
        <div class="player-name">${player}</div>
      `;
      playersContainer.appendChild(playerDiv);
    });
  }

  // ========== 2. CREAR RULETA CON SEGMENTOS PERFECTOS ==========
  function buildWheelSegments() {
    wheelContainer.innerHTML = "";
    for (let i = 0; i < segmentCount; i++) {
      const segment = document.createElement("div");
      segment.classList.add("segment");
      // colores brillantes alternados
      segment.style.background = COLOR_PALETTE[i % COLOR_PALETTE.length];
      // rotación base para cada segmento
      const rotateDeg = i * segmentAngle;
      segment.style.transform = `rotate(${rotateDeg}deg)`;

      // texto posicionado de forma elegante, compensando la rotación
      const textSpan = document.createElement("span");
      textSpan.innerText = PLAYERS_LIST[i];
      // ajuste tipográfico para que se vea bien en todos los tamaños
      const halfAngle = segmentAngle / 2;
      // rotación inversa para mantener texto legible (siempre horizontal relativo al centro)
      textSpan.style.transform = `rotate(${halfAngle - 90}deg)`;
      textSpan.style.top = "22%";
      textSpan.style.fontWeight = "800";
      textSpan.style.fontSize = "clamp(11px, 2.8vw, 18px)";
      textSpan.style.whiteSpace = "nowrap";
      // pequeña sombra extra para contraste
      textSpan.style.textShadow = "0 2px 5px rgba(0,0,0,0.3)";
      segment.appendChild(textSpan);

      wheelContainer.appendChild(segment);
    }
  }

  // ========== 3. LÓGICA DE PREMIO: GANADOR Y ANIMACIONES ==========
  function getWinnerIndexFromRotation(finalRotationDeg) {
    // La ruleta tiene los segmentos en orden 0...N, la flecha está fija arriba (ángulo -90°? pero nuestro pointer está a las 12 en punto)
    // El ángulo de la ruleta: cuando la ruleta rota, el segmento que queda debajo del puntero (ángulo 0° = norte) es el ganador.
    // Calculamos considerando que el segmento i está centrado en: i*segmentAngle + (segmentAngle/2)
    // Si la ruleta ha rotado `finalRotationDeg` grados, el offset de la posición inicial se invierte.
    // Para simplificar: rotación neta = finalRotationDeg % 360, la posición del borde 0 referencia.
    let netAngle = (360 - (finalRotationDeg % 360)) % 360;
    let winnerIdx = 0;
    for (let i = 0; i < segmentCount; i++) {
      let start = i * segmentAngle;
      let end = (i + 1) * segmentAngle;
      if (netAngle >= start && netAngle < end) {
        winnerIdx = i;
        break;
      }
    }
    return winnerIdx;
  }

  // Efecto visual extra en el ganador
  function highlightWinnerCard(winnerName, winnerIndex) {
    winnerNameSpan.innerHTML = winnerName;
    winnerNameSpan.classList.add("glow-text");
    setTimeout(() => {
      winnerNameSpan.classList.remove("glow-text");
    }, 600);

    // resaltar jugador en la lista lateral
    const allPlayersCards = document.querySelectorAll(".player-card");
    allPlayersCards.forEach((card, idx) => {
      card.style.transition = "all 0.2s";
      card.style.background = "";
      card.style.border = "1px solid rgba(203,213,225,0.5)";
      if (idx === winnerIndex) {
        card.style.background = "linear-gradient(120deg, #fef9c3, #fde047)";
        card.style.border = "2px solid #f59e0b";
        card.style.transform = "translateX(8px)";
        setTimeout(() => {
          if (card) card.style.transform = "";
        }, 800);
      }
    });
  }

  // Animación de partículas de celebración (efecto al ganar)
  function burstWinParticles() {
    const container = document.getElementById("particlesContainer");
    for (let i = 0; i < 35; i++) {
      const conf = document.createElement("div");
      conf.style.position = "absolute";
      conf.style.width = Math.random() * 12 + 4 + "px";
      conf.style.height = conf.style.width;
      conf.style.background = `hsl(${Math.random() * 360}, 80%, 65%)`;
      conf.style.borderRadius = "50%";
      conf.style.left = Math.random() * 100 + "%";
      conf.style.top = "50%";
      conf.style.opacity = "0.9";
      conf.style.pointerEvents = "none";
      conf.style.zIndex = "999";
      conf.style.boxShadow = "0 0 12px gold";
      conf.style.transition = "all 0.8s ease-out";
      container.appendChild(conf);
      const xMove = (Math.random() - 0.5) * 180;
      const yMove = (Math.random() - 0.5) * 120 - 60;
      conf.animate(
        [
          { transform: "translate(0px, 0px) scale(1)", opacity: 1 },
          { transform: `translate(${xMove}px, ${yMove - 40}px) scale(0)`, opacity: 0 },
        ],
        { duration: 1000, easing: "cubic-bezier(0.2, 0.9, 0.6, 1)" }
      );
      setTimeout(() => conf.remove(), 1100);
    }
  }

  // ========== 4. FUNCIÓN PRINCIPAL DE GIRAR CON CÁLCULO DE PRECISIÓN ==========
  function spinWheel() {
    if (isSpinning) return;

    isSpinning = true;
    spinButton.disabled = true;
    winnerNameSpan.innerHTML = "🌀 ¡Girando... suerte! 🌀";
    // elegir índice aleatorio (ganador real)
    const targetWinnerIndex = Math.floor(Math.random() * segmentCount);
    // vueltas extra espectaculares (entre 8 y 12 vueltas completas)
    const extraFullRotations = 360 * (Math.floor(Math.random() * 8) + 10); // 10 a 17 vueltas
    // calcular ángulo necesario para que el segmento targetWinnerIndex quede exactamente bajo el puntero
    // El centro del segmento i está a: i * segmentAngle + (segmentAngle/2)
    // Queremos que ese centro quede en el ángulo 0 (puntero fijo). La ruleta gira en sentido horario?
    // En CSS rotación positiva = horario. Si la ruleta rota X grados, el punto original que estaba en ángulo A pasa a A - X.
    // Para que el centro del segmento i quede en 0° debemos rotar: centro_i = i * segAngle + segAngle/2, entonces rotación = centro_i - 0.
    let targetCenter = targetWinnerIndex * segmentAngle + (segmentAngle / 2);
    // La rotación necesaria (en grados horarios) para llevar ese centro al top (0°) = targetCenter
    let neededRotation = targetCenter; 
    // Aseguramos que la rotación total sea extraFullRotations + neededRotation para que termine en el premio exacto
    let finalRotationDelta = extraFullRotations + neededRotation;
    // Acumular rotación
    currentRotationDeg += finalRotationDelta;
    // Aplicar transformación
    wheelContainer.style.transform = `rotate(${currentRotationDeg}deg)`;

    // Esperar fin de animación
    setTimeout(() => {
      const netRotationForWinner = currentRotationDeg % 360;
      let computedWinnerIdx = getWinnerIndexFromRotation(currentRotationDeg);
      // doble chequeo de seguridad por precisión flotante (match con destinado)
      if (computedWinnerIdx !== targetWinnerIndex) {
        // fallback leve por redondeo, recalcular con otro método
        let adjusted = (360 - (netRotationForWinner)) % 360;
        for (let i = 0; i < segmentCount; i++) {
          let startBound = i * segmentAngle;
          let endBound = (i + 1) * segmentAngle;
          if (adjusted >= startBound - 0.1 && adjusted < endBound + 0.1) {
            computedWinnerIdx = i;
            break;
          }
        }
      }
      const finalWinner = PLAYERS_LIST[computedWinnerIdx];
      highlightWinnerCard(finalWinner, computedWinnerIdx);
      winnerNameSpan.innerHTML = finalWinner;
      // Efecto de confeti/partículas mágicas
      burstWinParticles();
      isSpinning = false;
      spinButton.disabled = false;
    }, 6600); // sincronizado con la transición CSS (6.5s)
  }

  // ========== 5. AÑADIR FONDO DE PARTÍCULAS FLOTANTES ==========
  function createBackgroundParticles() {
    const particleContainer = document.getElementById("particlesContainer");
    const particleCount = 55;
    for (let i = 0; i < particleCount; i++) {
      const particle = document.createElement("div");
      particle.classList.add("particle");
      const size = Math.random() * 20 + 6;
      particle.style.width = size + "px";
      particle.style.height = size + "px";
      particle.style.left = Math.random() * 100 + "%";
      particle.style.top = Math.random() * 100 + "%";
      particle.style.animationDuration = Math.random() * 18 + 9 + "s";
      particle.style.animationDelay = Math.random() * 5 + "s";
      particle.style.opacity = Math.random() * 0.4 + 0.1;
      particleContainer.appendChild(particle);
    }
  }

  // ========== 6. RESET Y PREPARACIÓN FINAL ==========
  function init() {
    buildPlayersList();
    buildWheelSegments();
    createBackgroundParticles();
    // inicializar rotación visual aleatoria sutil para efecto dinámico inicial
    const randomResetRotation = (Math.random() * 360) % 360;
    currentRotationDeg = randomResetRotation;
    wheelContainer.style.transform = `rotate(${currentRotationDeg}deg)`;
    // sincronizar estado
    spinButton.addEventListener("click", spinWheel);
    // texto inicial elegante
    winnerNameSpan.innerHTML = "✨ Listo ✨";
  }

  init();
</script>
</body>
</html>
